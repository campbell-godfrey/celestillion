services:
  - type: web
    name: celestillion
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
    # Keeps daily results and leaderboards when the server restarts or redeploys.
    disk:
      name: celestillion-data
      mountPath: /var/data
      sizeGB: 1
